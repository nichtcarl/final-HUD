<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimal Vector HUD</title>

  <!-- iOS Safari WebApp Integration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUD">

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- Schriften -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-color: #ff0033;
      --accent-glow: rgba(255, 0, 51, 0.9);
      --bg-color: #000000;
      --speed-color: #ffffff;
      --speed-glow: rgba(255, 255, 255, 0.9);
      --radar-radius: 90px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--accent-color);
      font-family: 'DS-Digital', 'Orbitron', monospace, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100svh;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* Start Overlay */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100svh;
      background-color: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .start-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      padding: 20px 40px;
      border-radius: 16px;
      background: transparent;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .start-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .hint-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: #888;
      letter-spacing: 1px;
      text-align: center;
      padding: 0 20px;
    }

    /* Haupt-Container bleibt im Hochformat, Inhalt wird um 90 Grad gedreht */
    #app-container {
      width: 100svh;
      height: 100vw;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg) scaleY(-1);
      transition: transform 0.3s ease-in-out;
      background-color: #000000;
    }

    .hud-mode-disabled {
      transform: translate(-50%, -50%) rotate(90deg) scaleY(1) !important;
    }

    /* Echte Vektorkarte */
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #000000 !important;
      z-index: 1;
    }

    /* Dynamische Radar-Blende */
    #radar-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) var(--radar-radius), rgba(0,0,0,0.98) calc(var(--radar-radius) + 70px), #000000 100%);
    }

    /* Overlay Canvas für DNA-Helix */
    #overlayCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 20;
    }

    /* Oben Links: Tempolimit */
    #limit-display {
      position: absolute;
      top: max(25px, env(safe-area-inset-top));
      left: max(40px, env(safe-area-inset-left));
      z-index: 25;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .limit-value {
      font-family: 'DS-Digital', sans-serif;
      font-size: clamp(2.8rem, 5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      color: var(--accent-color);
      text-shadow: 0 0 25px var(--accent-glow);
    }

    /* Unten Mitte: Geschwindigkeit */
    #speed-display {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      pointer-events: none;
    }

    .speed-value {
      font-family: 'DS-Digital', sans-serif;
      font-size: clamp(5.5rem, 12vw, 8.5rem);
      font-weight: 900;
      line-height: 0.75;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: var(--speed-color);
      text-shadow: 0 0 40px var(--speed-glow);
      transition: color 0.5s ease-in-out, text-shadow 0.5s ease-in-out;
    }

    /* Unten Links: Aktuelle Adresse / GPS Status */
    #address-display {
      position: absolute;
      bottom: max(25px, env(safe-area-inset-bottom));
      left: max(40px, env(safe-area-inset-left));
      z-index: 25;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ffaa00;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.8);
      flex-shrink: 0;
    }

    .address-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: var(--accent-color);
      text-transform: uppercase;
      opacity: 0.85;
      text-shadow: 0 0 10px var(--accent-glow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    /* Controls Unten Rechts */
    #controls {
      position: absolute;
      bottom: max(25px, env(safe-area-inset-bottom));
      right: max(40px, env(safe-area-inset-right));
      z-index: 30;
      display: flex;
      gap: 8px;
      opacity: 0.4;
      transition: opacity 0.3s ease;
    }

    #controls:hover, #controls:active {
      opacity: 0.95;
    }

    button.ctrl-btn {
      font-family: 'Orbitron', sans-serif;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button.ctrl-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Start Overlay -->
  <div id="start-overlay">
    <button class="start-btn" onclick="startHUDWithClick()">START HUD</button>
    <div class="hint-text">WICHTIG: Über Safari "Zum Home-Bildschirm" hinzufügen für echtes Vollbild unter iOS!</div>
  </div>

  <div id="app-container">
    <div id="map"></div>
    <div id="radar-mask"></div>
    <canvas id="overlayCanvas"></canvas>

    <div id="limit-display">
      <span id="speed-limit" class="limit-value">--</span>
    </div>

    <div id="controls">
      <button class="ctrl-btn" onclick="forceLocationReload()">GPS</button>
      <button class="ctrl-btn" onclick="toggleDayNightManual()">MODE</button>
      <button class="ctrl-btn" id="hud-btn" onclick="toggleHUD()">HUD</button>
    </div>

    <div id="address-display">
      <div id="status-dot"></div>
      <span id="address-label" class="address-text">SUCHE POSITION...</span>
    </div>

    <div id="speed-display">
      <span id="speed" class="speed-value">0</span>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    let map;
    let userMarker;
    let markerElement;
    
    let currentSpeed = 0;
    let speedLimit = null;
    let isSpeeding = false;
    let flashInterval = null;
    let flashState = false;

    let dnaTimer = 0;
    let currentLat = 50.8163;
    let currentLng = 7.1725;
    let lastLimitFetchPos = null;

    const overlayCanvas = document.getElementById('overlayCanvas');
    const ctx = overlayCanvas.getContext('2d');

    const themes = {
      night: { hex: '#ff0033', glow: 'rgba(255, 0, 51, 0.9)', arrow: '#ffffff' },
      day: { hex: '#ffffff', glow: 'rgba(255, 255, 255, 0.9)', arrow: '#ff0033' }
    };
    let currentMode = 'night';

    function resizeOverlayCanvas() {
      overlayCanvas.width = window.innerWidth * window.devicePixelRatio;
      overlayCanvas.height = window.innerHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeOverlayCanvas);
    resizeOverlayCanvas();

    function calculateSunsetHour(lat, lng) {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((now - startOfYear) + ((startOfYear.getTimezoneOffset() - now.getTimezoneOffset()) * 60000)) / 86400000;
      const p = Math.asin(0.39795 * Math.sin((0.98565 * (dayOfYear - 173) + 3.1517) * Math.PI / 180));
      const latRad = lat * Math.PI / 180;
      const hourAngle = Math.acos(-Math.tan(latRad) * Math.tan(p));
      if (isNaN(hourAngle)) return 18;
      const sunsetTimeUTC = 12 + (hourAngle * 180 / Math.PI) / 15 - (lng / 15);
      return sunsetTimeUTC - (now.getTimezoneOffset() / 60);
    }

    function autoDetectNightMode(lat, lng) {
      const now = new Date();
      const currentDecimalHour = now.getHours() + (now.getMinutes() / 60);
      const sunsetHour = calculateSunsetHour(lat, lng);
      const nightModeStartHour = sunsetHour - 1.0;
      const sunriseHour = 24 - sunsetHour;
      return (currentDecimalHour >= nightModeStartHour || currentDecimalHour < sunriseHour) ? 'night' : 'day';
    }

    function initMap() {
      const activeColor = themes[currentMode].hex;

      const customStyle = {
        "version": 8,
        "name": "HUD Pure Black",
        "sources": {
          "openmaptiles": {
            "type": "vector",
            "url": "https://tiles.openfreemap.org/planet"
          }
        },
        "layers": [
          {
            "id": "background",
            "type": "background",
            "paint": { "background-color": "#000000" }
          },
          {
            "id": "road_minor",
            "type": "line",
            "source": "openmaptiles",
            "source-layer": "transportation",
            "filter": ["in", "class", "minor", "service", "track", "path"],
            "paint": {
              "line-color": activeColor,
              "line-width": 2.5,
              "line-opacity": 0.9
            }
          },
          {
            "id": "road_major",
            "type": "line",
            "source": "openmaptiles",
            "source-layer": "transportation",
            "filter": ["in", "class", "primary", "secondary", "tertiary", "trunk", "motorway", "street"],
            "paint": {
              "line-color": activeColor,
              "line-width": 4,
              "line-opacity": 1.0
            }
          }
        ]
      };

      map = new maplibregl.Map({
        container: 'map',
        style: customStyle,
        center: [currentLng, currentLat],
        zoom: 17.5,
        pitch: 0,
        bearing: 0
      });

      map.on('load', () => {
        markerElement = document.createElement('div');
        markerElement.innerHTML = `
          <svg width="44" height="44" viewBox="0 0 100 100" id="user-arrow">
            <polygon points="50,5 95,90 50,70 5,90" fill="${themes[currentMode].arrow}" stroke="#000000" stroke-width="4"/>
          </svg>
        `;

        userMarker = new maplibregl.Marker({ element: markerElement })
          .setLngLat([currentLng, currentLat])
          .addTo(map);
      });
    }

    async function fetchAddressLabel(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
        const data = await res.json();
        if (data && data.address) {
          const road = data.address.road || data.address.pedestrian || data.address.suburb || "STRASSE";
          const city = data.address.city || data.address.town || data.address.village || "";
          document.getElementById('address-label').innerText = city ? `${road}, ${city}` : road;
        }
      } catch (e) {
        document.getElementById('address-label').innerText = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
      }
    }

    async function fetchSpeedLimit(lat, lng) {
      if (lastLimitFetchPos) {
        const dLat = Math.abs(lat - lastLimitFetchPos.lat);
        const dLng = Math.abs(lng - lastLimitFetchPos.lng);
        if (dLat < 0.001 && dLng < 0.001) return;
      }
      lastLimitFetchPos = { lat, lng };
      fetchAddressLabel(lat, lng);

      try {
        const query = `[out:json][timeout:5];way(around:25,${lat},${lng})["maxspeed"];out tags;`;
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data.elements && data.elements.length > 0 && data.elements[0].tags.maxspeed) {
          const limit = parseInt(data.elements[0].tags.maxspeed);
          if (!isNaN(limit)) {
            speedLimit = limit;
            document.getElementById('speed-limit').innerText = limit;
            return;
          }
        }
        speedLimit = null;
        document.getElementById('speed-limit').innerText = "--";
      } catch (e) {}
    }

    function updateCameraAndRadar(kmh, newPos, heading) {
      if (!map) return;
      currentSpeed = kmh;

      const targetPitch = kmh > 3 ? Math.min(72, 35 + (kmh * 0.45)) : 0;
      const targetZoom = kmh > 100 ? 15.2 : (kmh > 60 ? 16.0 : (kmh > 20 ? 16.8 : 17.5));
      const currentBearing = heading !== null && !isNaN(heading) ? heading : map.getBearing();

      map.easeTo({
        center: newPos,
        pitch: targetPitch,
        zoom: targetZoom,
        bearing: currentBearing,
        duration: 800,
        easing: (t) => t * (2 - t)
      });

      if (userMarker) userMarker.setLngLat(newPos);

      const arrow = document.getElementById('user-arrow');
      if (arrow) {
        arrow.style.transform = `rotate(0deg)`;
      }

      const radarRadiusPx = Math.min(window.innerWidth * 0.65, 75 + (kmh * 4.5));
      document.documentElement.style.setProperty('--radar-radius', `${radarRadiusPx}px`);
    }

    function handleSpeedingFlashing(speeding) {
      const root = document.documentElement;
      if (speeding && !isSpeeding) {
        isSpeeding = true;
        flashState = false;
        if (flashInterval) clearInterval(flashInterval);
        
        flashInterval = setInterval(() => {
          flashState = !flashState;
          if (flashState) {
            root.style.setProperty('--speed-color', '#ffffff');
            root.style.setProperty('--speed-glow', 'rgba(255, 255, 255, 0.9)');
          } else {
            root.style.setProperty('--speed-color', '#ff0033');
            root.style.setProperty('--speed-glow', 'rgba(255, 0, 51, 0.9)');
          }
        }, 500);
      } else if (!speeding && isSpeeding) {
        isSpeeding = false;
        if (flashInterval) clearInterval(flashInterval);
        flashInterval = null;
        root.style.setProperty('--speed-color', '#ffffff');
        root.style.setProperty('--speed-glow', 'rgba(255, 255, 255, 0.9)');
      }
    }

    // Deutlich breitere und markantere DNA-Spule für eine perfekte Reflektion
    function drawRetroDNAVisualizer() {
      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      const w = overlayCanvas.width;
      const h = overlayCanvas.height;
      const accent = themes[currentMode].hex;

      const dnaWidth = Math.min(360, w * 0.38); // Breiter ausgelegt
      const dnaHeight = 75;                     // Mehr Höhe für sattes Volumen
      const marginRight = Math.max(30, w * 0.03);
      const marginTop = Math.max(25, h * 0.06);

      const startX = w - dnaWidth - marginRight;
      const startY = marginTop;

      const speedRotation = 0.008 + (currentSpeed * 0.0008);
      dnaTimer += speedRotation;

      ctx.save();
      ctx.strokeStyle = accent;
      ctx.fillStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 22;
      ctx.lineWidth = 4; // Dickere Linien

      const numPoints = 18;
      const spacing = dnaWidth / numPoints;

      for (let i = 0; i < numPoints; i++) {
        const x = startX + (i * spacing);
        const angle = dnaTimer + (i * 0.38);

        const y1 = startY + Math.sin(angle) * (dnaHeight / 2);
        const y2 = startY - Math.sin(angle) * (dnaHeight / 2);

        ctx.globalAlpha = 0.45;
        ctx.beginPath();
        ctx.moveTo(x, y1);
        ctx.lineTo(x, y2);
        ctx.stroke();

        ctx.globalAlpha = 1.0;
        ctx.beginPath();
        ctx.arc(x, y1, 5.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x, y2, 5.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      requestAnimationFrame(drawRetroDNAVisualizer);
    }

    function startHUDWithClick() {
      document.getElementById('start-overlay').style.display = 'none';
      forceLocationReload();
      requestAnimationFrame(drawRetroDNAVisualizer);
      
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    function forceLocationReload() {
      document.getElementById('status-dot').style.backgroundColor = '#ffaa00';
      document.getElementById('status-dot').style.boxShadow = '0 0 10px rgba(255, 170, 0, 0.8)';
      document.getElementById('address-label').innerText = "SUCHE GPS...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            map.jumpTo({ center: [currentLng, currentLat], zoom: 17.5 });
            fetchSpeedLimit(currentLat, currentLng);

            document.getElementById('status-dot').style.backgroundColor = '#00ffcc';
            document.getElementById('status-dot').style.boxShadow = '0 0 10px rgba(0, 255, 204, 0.8)';
          },
          (err) => {
            document.getElementById('address-label').innerText = "GPS ERFORDERLICH";
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );

        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            const heading = pos.coords.heading;
            const speedMS = pos.coords.speed || 0;
            const kmh = Math.round(speedMS * 3.6);

            document.getElementById('speed').innerText = kmh;
            handleSpeedingFlashing(speedLimit && kmh > speedLimit);

            currentMode = autoDetectNightMode(currentLat, currentLng);
            
            updateCameraAndRadar(kmh, [currentLng, currentLat], heading);
            fetchSpeedLimit(currentLat, currentLng);
          },
          (err) => {},
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      }
    }

    function applyTheme(mode) {
      currentMode = mode;
      const theme = themes[mode];
      document.documentElement.style.setProperty('--accent-color', theme.hex);
      document.documentElement.style.setProperty('--accent-glow', theme.glow);
      
      if (map) {
        map.remove();
      }
      initMap();
    }

    function toggleDayNightManual() {
      const newMode = (currentMode === 'night') ? 'day' : 'night';
      applyTheme(newMode);
    }

    function toggleHUD() {
      const container = document.getElementById("app-container");
      container.classList.toggle("hud-mode-disabled");
    }

    window.onload = () => {
      currentMode = autoDetectNightMode(currentLat, currentLng);
      initMap();
    };
  </script>
</body>
</html>
